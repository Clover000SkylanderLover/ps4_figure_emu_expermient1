name: Build PS4 Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Compile Plugin
        run: |
          gcc -O2 -fPIC -shared \
            src/font.c \
            src/portal_protocol.c \
            src/ui_overlay.c \
            src/main.c \
            -o ps4_figure_emu.prx

      - name: Upload PRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4_figure_emu
          path: ps4_figure_emu.prx
