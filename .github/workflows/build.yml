name: Build PS4 Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          echo "=== Found the following files in your repository: ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Compile PS4 PRX
        run: |
          # Collect all .c files anywhere in the repository
          C_FILES=$(find . -name "*.c" -not -path "./.*")
          echo "Compiling: $C_FILES"
          
          # Compile into shared PRX binary
          gcc -std=c11 -O2 -fPIC -shared -I. -Isrc -Iinclude $C_FILES -o ps4_figure_emu.prx

      - name: Upload PRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4_figure_emu
          path: ps4_figure_emu.prx
