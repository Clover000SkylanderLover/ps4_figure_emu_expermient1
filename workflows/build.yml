name: Build PS4 Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup OpenOrbis Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libssl-dev
          git clone --recurse-submodules https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /home/runner/openorbis
          echo "OO_TOOLCHAIN=/home/runner/openorbis" >> $GITHUB_ENV
          export OO_TOOLCHAIN=/home/runner/openorbis
          cd /home/runner/openorbis && chmod +x build.sh && ./build.sh

      - name: Compile Plugin
        run: |
          export OO_TOOLCHAIN=/home/runner/openorbis
          make

      - name: Upload PRX File
        uses: actions/upload-artifact@v3
        with:
          name: ps4_figure_emu
          path: ps4_figure_emu.prx
